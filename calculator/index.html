<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماشين حساب</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1> ماشین حساب </h1>

<div class="menu">
<button onclick="showCalculator()">ماشين حساب</button>
<button onclick="showArea()">مساحت</button>
<button onclick="showPerimeter()">محیط</button>
</div>

<!-- ماشين حساب -->
<div id="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="append('/')">&#247;</button>
<button onclick="append('*')">&#215;</button>
<button onclick="sqrt()">&radic;</button>
<button onclick="append('-')">-</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('+')">+</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="sqrt()">√</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="power()">x²</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="percent()">%</button>
<button onclick="calculate()">=</button>

<button onclick="clearDisplay()">C</button>
<button onclick="backspace()">⌫</button>

</div>

</div>

<!-- مساحت -->

<div id="area" style="display:none;">

<select id="shape" onchange="updateInputs()">

<option value="square">مربع</option>

<option value="rectangle">مستطيل</option>

<option value="triangle">مثلث</option>

<option value="circle">دايره</option>

<option value="trapezoid">ذوزنقه</option>

<option value="rhombus">لوزي</option>

</select>

<div id="inputs"></div>

<button onclick="calculateArea()">محاسبه</button>

<h2 id="result"></h2>

</div>

</div>

<script src="script.js"></script>

<!-- محیط -->

<div id="perimeter" style="display:none;">

<select id="perimeterShape" onchange="updatePerimeterInputs()">
    <option value="square">مربع</option>
    <option value="rectangle">مستطیل</option>
    <option value="triangle">مثلث</option>
    <option value="circle">دایره</option>
</select>

<div id="perimeterInputs"></div>

<button onclick="calculatePerimeter()">محاسبه</button>

<h2 id="perimeterResult"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
