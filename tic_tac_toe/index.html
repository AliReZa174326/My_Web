<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="menu">

    <h1>🎮 Tic Tac Toe</h1>

    <button onclick="startGame('2player')">
        👥 دو نفره
    </button>

    <button onclick="startGame('easy')">
        🤖 AI آسان
    </button>

    <button onclick="startGame('medium')">
        🤖 AI متوسط
    </button>

    <button onclick="startGame('hard')">
        🤖 AI سخت
    </button>

</div>


<div id="game">

    <h1>🎮 Tic Tac Toe</h1>

    <h2 id="turn">نوبت: X</h2>

    <div class="board">

        <button></button>
        <button></button>
        <button></button>

        <button></button>
        <button></button>
        <button></button>

        <button></button>
        <button></button>
        <button></button>

    </div>

    <h2 id="result"></h2>

    <button onclick="restart()">
        🔄 شروع دوباره
    </button>

</div>


<script src="script.js"></script>

</body>

</html>
